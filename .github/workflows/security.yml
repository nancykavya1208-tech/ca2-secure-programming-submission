name: Security Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  #v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install bandit semgrep
      - name: Bandit SAST (Gate)
        run: bandit -r app.py -b bandit-baseline.json --severity-level high --confidence-level high
      - name: Bandit SAST (Report)
        run: bandit -r app.py -f json -o bandit.json --exit-zero
      - name: Semgrep SAST (Gate)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            semgrep --config p/python --config p/flask --config .semgrep/ --severity ERROR --baseline-commit origin/${{ github.base_ref }} --error --sarif -o semgrep.sarif .
          else
            semgrep --config .semgrep/ --severity ERROR --error --sarif -o semgrep.sarif .
          fi
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410  #v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  #v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  #v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: SCA Scan
        run: pip-audit -r requirements.txt --desc on

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  #v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc  #v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      APP_DB: /tmp/test_expenses_${{ github.run_id }}.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  #v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  #v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt pytest pyyaml
      - name: Seed test DB
        run: python seed.py
      - name: Run Custom Tests
        env:
          PYTHONPATH: .
        run: pytest tests/test_security.py -v --tb=short --junitxml=test-results.xml
